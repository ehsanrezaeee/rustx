[package]
name = "rustx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
rustx-core = { path = "../rustx-core" }
taffy = "=0.7.7"
cosmic-text = { version = "=0.14.2", default-features = false, features = ["std", "swash"] }
vello = "=0.5.0"
winit = { version = "=0.30.12", default-features = false, features = ["rwh_06", "x11"] }
pollster = "=0.4.0"
tiny-skia = "=0.11.4"
fontdue = "=0.9.3"
softbuffer = "=0.4.6"
serde_json = "1"
png = "=0.17.16"
unicode-segmentation = "=1.13.3"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = ["Window", "Performance", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Node", "console", "Location", "CanvasRenderingContext2d", "ImageData"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = "=0.25.1"
accesskit_winit = { version = "=0.34.1", default-features = false, features = ["rwh_06"] }
ureq = "=2.12.1"
tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }

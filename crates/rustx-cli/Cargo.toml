[package]
name = "rustx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rustx"
description = "RustX project, build, development and isolated local playground tooling"
include = ["Cargo.toml", "Cargo.lock", "build.rs", "src/**", "templates/**", "assets/**"]
[[bin]]
name = "rustx"
path = "src/main.rs"
[[bin]]
name = "rustx-cli"
path = "src/legacy.rs"
[dependencies]
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
flate2 = "=1.1.10"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
libc = "=0.2.190"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }


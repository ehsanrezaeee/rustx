name: Native application packages (RP-007)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/rustx-cli/**'
      - 'crates/rustx-engine/**'
      - 'scripts/test-native-package.mjs'
      - 'scripts/test-windows-interaction.ps1'
      - '.github/workflows/native-packages.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTX_NATIVE_EVIDENCE_DIR: docs/evidence/react-parity/RP-007/ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Pinned native CLI
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          cargo test -p rustx-cli --locked
          cargo build -p rustx-cli --bin rustx --locked
      - name: macOS extracted application startup
        if: runner.os == 'macOS'
        run: node scripts/test-native-package.mjs
      - name: Windows extracted application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          node scripts/test-native-package.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native package verification failed' }
      - name: RP-008 extracted Windows keyboard and resize
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw (Join-Path $env:RUSTX_NATIVE_EVIDENCE_DIR 'native-win32.json') | ConvertFrom-Json
          $stem = [IO.Path]::GetFileNameWithoutExtension($package.archive)
          $exe = Join-Path $package.base "recipient\$stem\native-demo.exe"
          & ./scripts/test-windows-interaction.ps1 -Executable $exe |
            Set-Content -Encoding utf8 (Join-Path $env:RUSTX_NATIVE_EVIDENCE_DIR 'interaction-win32.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-package-${{ matrix.os }}
          path: |
            releases/RP-007/
            docs/evidence/react-parity/RP-007/

name: RustX source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native CPU demo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Use Intel macOS to avoid the ARM hosted-runner capacity shortage.
        os: [windows-2025, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUSTX_RENDERER: cpu
      RUSTX_SMOKE_FRAMES: '2'
      RUSTX_DEMO: applications
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Linux X11 smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 libxi6
      - name: Build the native demo from source
        run: cargo run -p rustx-cli --locked -- build --target native --out dist-native
      - name: Run the built demo for two CPU frames
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./dist-native/rustx-lab.exe
          elif [[ "$RUNNER_OS" == Linux ]]; then
            timeout 30s xvfb-run -a ./dist-native/rustx-lab
          else
            ./dist-native/rustx-lab
          fi

  browser-demo:
    name: Current source-built web demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Rust formatting and unit checks
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: Build and start the current demo
        run: docker compose up --build -d --wait
      - name: Check the served build and fixture data
        run: |
          base="http://$(docker compose port demo 3000)"
          curl --fail --silent --show-error "$base/" | grep -F 'id="surface"'
          curl --fail --silent --show-error "$base/assets.json" | jq -er '.build'
          curl --fail --silent --show-error "$base/api/users" | jq -e 'length > 0'
      - name: Stop the demo
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down

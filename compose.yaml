services:
  demo:
    build:
      context: .
      target: demo
    ports:
      # Let Docker select an available host port unless a fixed one is requested.
      - '${RUSTX_BIND:-127.0.0.1}:${RUSTX_PORT:-0}:3000'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
